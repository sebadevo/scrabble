[project]
name = "scrabble"
version = "0.1.0"
description = "Scrabble game in python stdout in BA1 from EPB at ULB"
readme = "README.md"
authors = [{ name = "Sébastien De Vos", email = "sebastien.devos22@gmail.com" }]
requires-python = ">=3.14.0"
dependencies = []

[tool.pyrefly]
project-includes = ["**/*"]
project-excludes = ["**/*venv/**/*"]

[dependency-groups]
dev = [
    "prek>=0.3.3",
    "pyrefly>=0.53.0",
    "ruff>=0.15.2",
    "ty>=0.0.18",
    { include-group = "test" },
]

test = ["pytest>=9.0.2", "pytest-cov>=7.0.0"]

[project.scripts]
scrabble = "scrabble:main"

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
# exclude = ["**/*.ipynb"] # Exclude Notebooks from linting and formatting

[tool.ruff.lint]
select = [
    "AIR", # Airflow
    "ERA", # eradicate
    "FAST", # FastApi
    "YTT", # flake8-2020
    "ANN", # flake8-annotations
    "ASYNC", # flake8-async
    "S", # flake8-bandit
    "BLE", # flake8-blind-except
    "FBT", # flake8-boolean-trap
    "B", # flake8-bugbear
    "A", # flake8-builtins
    "COM", # flake8-commas
    "C4", # flake8-comprehensions
    "CPY", # flake8-copyright
    "DTZ", # flake8-datetimez
    "T10", # flake8-debugger
    "DJ", # flake8-django
    "EM", # flake8-errmsg
    "EXE", # flake8-executable
    "FIX", # flake8-fixme
    "FA", # flake8-future-annotations
    "INT", # flake8-gettext
    "ISC", # flake8-implicit-str-concat
    "ICN", # flake8-import-convention
    "LOG", # flake8-logging
    "G", # flake8-loggin-format
    "INP", # flake8-no-pep420
    "PIE", # flake8-pie
    "PYI", # flake8-pyi
    "PT", # flake8-pytest-style
    "Q", # flake8-quotes
    "RSE", # flake8-raise
    "RET", # flake8-return
    "SLF", # flake8-self
    "SIM", # flake8-simplify
    "SLOT", # flake8-slots
    "TID", # flake8-tidy-imports
    "TD", # flake8-todos
    "TC", # flake8-type-checking
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "FLY", # flynt
    "I", # isort
    "C90", # mccabe
    "NPY", # NumPy-specific
    "PD", # pandas-vet
    "N", # pep8-naming
    "PERF", # Perflint
    "E", # pycodestyle
    "W", # pycodestyle
    "DOC", # pydoclint
    "D", # pydocstyle
    "F", # Pyflakes
    "PGH", # pygrep-hooks
    "PL", # Pylint
    "UP", # pyupgrade
    "FURB", # refurb
    "RUF", # Ruff-specific
    "TRY", # tryceratops
]

ignore = [
    "T20", # flake8-print, is removed from this project as it is a cli interactive project.
    "RET504", # flake8-return unnecessary-assign, personal preference
    "D100", # pydocstyle undocumented-public-module, can't do much about public packages not having documentations
    "D203", # pydocstyle 1 blank line required before class docstring, personal preference for D211
]

fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.extend-per-file-ignores]
"tests/**/*.py" = [
    # at least this three should be fine in tests:
    "S101", # asserts allowed in tests...
    "ARG", # Unused function args -> fixtures nevertheless are functionally relevant...
    "FBT", # Don't care about booleans as positional arguments in tests, e.g. via @pytest.mark.parametrize()
    # The below are debateable
    "PLR2004", # Magic value used in comparison, ...
    "S311", # Standard pseudo-random generators are not suitable for cryptographic purposes
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.typos.files]
extend-exclude = [
    "resources/*",
]
