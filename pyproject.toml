[project]
name = "scrabble"
version = "0.1.0"
description = "Scrabble game in python stdout in BA1 from EPB at ULB"
readme = "README.md"
authors = [
    { name = "Sébastien De Vos", email = "sebastien.devos@euranova.eu" }
]
requires-python = "~=3.13.0"
dependencies = []

[dependency-groups]
dev = [
    "pyrefly>=0.25.1",
    "ruff>=0.12.3",
    "ty>=0.0.1a14",
]

test = [
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
]

[project.scripts]
scrabble = "scrabble:main"

[build-system]
requires = ["uv_build>=0.8.3,<0.9.0"]
build-backend = "uv_build"


[tool.pytest.ini_options]
pythonpath = [
    ".", 
    "src",
]
