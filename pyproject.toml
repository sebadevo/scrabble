[project]
name = "scrabble"
version = "0.1.0"
description = "Scrabble game in python stdout in BA1 from EPB at ULB"
readme = "README.md"
authors = [{ name = "Sébastien De Vos", email = "sebastien.devos@euranova.eu" }]
requires-python = "~=3.13.0"
dependencies = []

[tool.pyrefly]
project-includes = ["**/*"]
project-excludes = ["**/*venv/**/*"]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pyrefly>=0.46.0",
    "ruff>=0.14.10",
    "ty>=0.0.7",
    { include-group = "test" },
]

test = ["pytest>=9.0.2", "pytest-cov>=7.0.0"]

[project.scripts]
scrabble = "scrabble:main"

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"
