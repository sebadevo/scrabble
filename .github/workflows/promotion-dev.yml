name: Release Promotion Guard (dev)

permissions:
  contents: read

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - release/dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  promotion_dev:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: ./.github/actions/release-promotion-guard
